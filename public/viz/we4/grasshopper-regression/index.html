<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Two grasshoppers fit a line</title>
<link rel="stylesheet" href="css/style.css">
<script src="js/errors.js"></script>
</head>
<body>
<header>
  <h1>Two grasshoppers fit a line</h1>
  <div class="controls">
    <button id="prev" title="Back one step (left arrow)">Back</button>
    <span id="count" class="count">Start</span>
    <button id="next" title="Next step (right arrow, space, page down)">Next</button>
    <span class="gap"></span>
    <button id="run1" title="Finish this iteration, or do one more">+1</button>
    <button id="run10" title="Ten more iterations">+10</button>
    <button id="run100" title="A hundred more iterations">+100</button>
    <button id="play" title="Play or pause the iterations (p)">Play</button>
    <span class="gap"></span>
    <label title="How far each grasshopper jumps, per unit of slope">&alpha; <select id="alpha"></select></label>
    <label title="How far each grasshopper hops to feel the slope">&epsilon; <select id="eps"></select></label>
    <button id="restart" title="Type a new start (home)">New start</button>
  </div>
</header>
<main>
  <svg id="stage" viewBox="0 0 1600 870" preserveAspectRatio="xMidYMid meet" role="img"
       aria-label="Two grasshoppers learn w and b of a line through three sunrise photos"></svg>
</main>
<script src="data/data.js"></script>
<script src="js/engine.js"></script>
<script src="js/svg.js"></script>
<script src="js/page.js"></script>
</body>
</html>
